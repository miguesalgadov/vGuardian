# ============================================================================
#  eGuardian AI Concierge — Orquestación local / staging
#  Levanta: API (Laravel), Frontend (Next.js), PostgreSQL, Redis,
#  Reverb (WebSockets) y NGINX como reverse-proxy.
# ============================================================================
version: "3.9"

services:
  # ---------------------------- Base de datos -------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eg_postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-eguardian}
      POSTGRES_USER: ${DB_USERNAME:-eguardian}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-eguardian}"]
      interval: 10s
      retries: 5
    networks: [eg_net]

  # ---------------------------- Cache / colas -------------------------------
  redis:
    image: redis:7-alpine
    container_name: eg_redis
    networks: [eg_net]

  # ---------------------------- API (Laravel) -------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eg_api
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - ./backend:/var/www/html
    networks: [eg_net]

  # ---------------------- WebSockets (Laravel Reverb) -----------------------
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eg_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on: [api, redis]
    networks: [eg_net]

  # ---------------------------- Frontend (Next.js) --------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eg_web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost/ws
    depends_on: [api]
    networks: [eg_net]

  # ---------------------------- Reverse proxy -------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: eg_nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web, reverb]
    networks: [eg_net]

volumes:
  pg_data:

networks:
  eg_net:
    driver: bridge
